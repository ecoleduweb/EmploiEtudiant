name: Deployer EmploiEtudiant PROD
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Full Application
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e # Exit immediately if a command exits with a non-zero status.
            echo "Starting deployment process..."

            # Arrêt des services
            echo "Stopping services..."
            systemctl stop front-end.service || echo "Front-end service not running"
            systemctl stop back-end.service || echo "API service not running"

            # Copie du fichier de logs
            echo 'Moving logs file to logs backup folder'
            DATE=$(date +'%Y-%m-%d_%H-%M')
            #Pas encore de logs dans notre app
            #[ -f "/var/www/emploi/back-end/API/logs.txt" ] && cp /var/www/emploi/back-end/API/logs.txt /var/www/logs/logs_Emploi_$DATE.txt

            # Suppression et recréation du répertoire
            echo "Refreshing project directory..."
            mkdir -p /var/www/emploi
            find /var/www/emploi -mindepth 1 -delete

            #Préparation du VENV
            echo "Cloning fresh repository..."
            git clone --branch ${{ github.ref_name }} --depth 1 https://github.com/ecoleduweb/ProjetApplicationH2024.git /var/www/emploi
            # Préparation du VENV
            cd /var/www/emploi//back-end
            python3 -m venv venv
            source venv/bin/activate

            # Dépendances système
            pip install -r requirements.txt
            
            # Configuration API
            echo "Configuring API..."
            cd /var/www/emploi/back-end/API
            cat > .env << EOF
            DATABASE_TEST_URL=${{ secrets.DATABASE_TEST_URL }}
            DATABASE_DEV_URL=${{ secrets.DATABASE_PROD_URL }}
            CORS=${{ secrets.PROD_CORS_IP }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            MAIL_ENABLED=True
            MAIL_CLIENT_ID=${{ secrets.MAIL_CLIENT_ID }}
            CLIENT_SECRET=${{ secrets.MAIL_CLIENT_SECRET }}
            MAIL_TENANT_ID=${{ secrets.MAIL_TENANT_ID }}
            MAIL_GRAPH_USER_ID=${{ secrets.MAIL_GRAPH_USER_ID }}
            MAIL_ADMINISTRATOR_ADDRESS=${{ secrets.MAIL_ADMINISTRATOR_ADDRESS }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            RECAPTCHA_KEY=${{ secrets.RECAPTCHA_KEY }}
            URL=${{ secrets.PROD_URL }}
            ENABLE_TRACING=True
            TRACE_URL=https://telemetry.edwrdl.ca/traces
            APPLICATION_NAME=API_EMPLOI_ETUDIANT_PROD
            EOF
            
            echo "Running migrations..."
            flask db upgrade

            # Configuration Frontend
            echo "Configuring Frontend..."
            cd /var/www/emploi/front-end/projet_application
            cat > .env << EOF
            PUBLIC_BASE_URL=${{ secrets.PROD_FRONT_PUBLIC_URL}}
            PUBLIC_RECAPTCHA_KEY=${{ secrets.PUBLIC_RECAPTCHA_KEY}}
            PUBLIC_PUBLIC_MEASUREMENT_ID=${{ secrets.PUBLIC_PUBLIC_MEASUREMENT_ID}}
            PUBLIC_TRACE_URL=https://telemetry.edwrdl.ca/traces
            PUBLIC_APPLICATION_NAME=EMPLOI_ETUDIANT_PROD
            PUBLIC_ENABLED_TELEMETRY=TRUE
            EOF

            echo "Building Frontend..."
            npm ci
            npm run build

            # Démarrage des services
            echo "Starting services..."
            systemctl start back-end.service || echo "Failed to start API service"
            systemctl start front-end.service || echo "Failed to start Frontend service"


            echo "Deployment completed successfully!"
