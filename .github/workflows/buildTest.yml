name: Test build

on:
  push:
    branches:
      - dev
    paths:
      - "front-end/**"
  pull_request:
    branches:
      - dev
    paths:
      - "front-end/**"

jobs:
  Test_Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # or any other version you want

      - name: Clean up node_modules and package-lock.json projet_application
        run: |
          rm -rf node_modules package-lock.json
        working-directory: front-end/projet_application

      - name: Install front-end dependencies
        run: npm install
        working-directory: front-end/projet_application

      - name: Test Build
        working-directory: front-end/projet_application
        run: |
          npx vite build
