name: DEV - Build & Deploy
on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy NodeJS app
        uses: appleboy/ssh-action@v0.1.2

        with:
          host: ${{secrets.DEV_SSH_HOST}}
          key: ${{secrets.DEV_SSH_KEY}}
          username: ${{ secrets.SSH_USERNAME}}

          script: |
            sudo systemctl stop front-end
            sudo systemctl stop back-end
            echo 'moving log file to logs folder'
            mkdir /root/logs
            DATE=$(date +'%Y-%m-%d_%H-%M')
            cp /root/dev_project/ProjetApplicationH2024/back-end/API/logs.txt /root/logs/logs_$DATE.txt
            rm -r dev_project
            mkdir dev_project
            cd dev_project
            git clone -b dev git@github.com:ecoleduweb/ProjetApplicationH2024.git
            echo 'Deployment successful to DEV server'
            echo 'Installing backend packages'
            sudo apt-get update -y
            sudo apt-get install -y libmariadb-dev
            sudo apt-get install -y locales
            sudo locale-gen fr_FR.UTF-8
            sudo update-locale
            python -m pip install --upgrade pip
            cd /${{ secrets.SSH_USERNAME}}/dev_project/ProjetApplicationH2024/back-end/
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            cd /${{ secrets.SSH_USERNAME}}/dev_project/ProjetApplicationH2024/back-end/API
            touch .env
            echo DATABASE_TEST_URL=${{ secrets.DATABASE_TEST_URL }} >> .env
            echo DATABASE_DEV_URL=${{ secrets.DATABASE_DEV_URL }} >> .env
            echo CORS=${{ secrets.DEV_CORS_IP }} >> .env
            echo SECRET_KEY=${{ secrets.SECRET_KEY }} >> .env
            echo MAIL_ENABLED=True >> .env
            echo CLIENT_ID=${{ secrets.MAIL_CLIENT_ID }} >> .env
            echo CLIENT_SECRET=${{ secrets.MAIL_CLIENT_SECRET }} >> .env
            echo TENANT_ID=${{ secrets.MAIL_TENANT_ID }} >> .env
            echo MAIL_GRAPH_USER_ID=${{ secrets.MAIL_GRAPH_USER_ID }} >> .env
            echo MAIL_ADMINISTRATOR_ADDRESS=emploietudiant@mailinator.com >> .env
            echo ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }} >> .env
            echo RECAPTCHA_KEY=${{ secrets.RECAPTCHA_KEY }} >> .env
            echo URL=${{ secrets.DEV_URL }} >> .env
            echo ENABLE_TRACING=true >> .env
            echo TRACE_URL=https://telemetry.edwrdl.ca/traces >> .env
            echo APPLICATION_NAME=API_EMPLOI_ETUDIANT_DEV >> .env
            flask db upgrade
            echo 'Installing packages'
            sudo systemctl enable back-end
            sudo systemctl start back-end
            cd /${{ secrets.SSH_USERNAME}}/dev_project/ProjetApplicationH2024/front-end/projet_application
            npm i
            touch .env
            echo PUBLIC_BASE_URL = ${{ secrets.DEV_FRONT_PUBLIC_URL }} >> .env
            echo 'Building front-end'
            echo PUBLIC_RECAPTCHA_KEY=${{ secrets.PUBLIC_RECAPTCHA_KEY }} >> .env
            echo PUBLIC_PUBLIC_MEASUREMENT_ID=${{ secrets.PUBLIC_PUBLIC_MEASUREMENT_ID }} >> .env
            echo PUBLIC_TRACE_URL=https://telemetry.edwrdl.ca/traces >> .env
            echo PUBLIC_APPLICATION_NAME=EMPLOI_ETUDIANT_DEV >> .env
            echo PUBLIC_ENABLED_TELEMETRY=TRUE >> .env
            npm run build
            echo 'Starting services'
            sudo systemctl enable front-end
            sudo systemctl start front-end
